<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventarios - Repuestos & Pedidos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .low-stock { color: #ef4444; font-weight: 700; }
        .loader { border: 3px solid #e2e8f0; border-top: 3px solid #2563eb; border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-2.5 rounded-xl shadow-md shadow-blue-500/20">
                        <i data-lucide="wrench" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 leading-tight">AutoPartes <span class="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 font-semibold border border-blue-100">Pro</span></h1>
                        <p class="text-xs text-slate-500">Gestión Inteligente de Inventarios</p>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="openOrderModal()" class="bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-700 hover:to-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition shadow-md shadow-sky-500/20">
                        <i data-lucide="plane-takeoff" class="w-4 h-4"></i> <span class="hidden sm:inline">Nuevo Pedido Int.</span>
                    </button>
                    <button onclick="openClientModal()" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition shadow-sm">
                        <i data-lucide="user-plus" class="w-4 h-4 text-purple-600"></i> <span class="hidden sm:inline">Cliente</span>
                    </button>
                    <button onclick="openSupplierModal()" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition shadow-sm">
                        <i data-lucide="truck" class="w-4 h-4 text-amber-600"></i> <span class="hidden sm:inline">Proveedor</span>
                    </button>
                    <button onclick="openProductModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition shadow-md shadow-blue-500/20">
                        <i data-lucide="plus" class="w-4 h-4"></i> Producto
                    </button>
                    <button onclick="openMovementModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition shadow-md shadow-emerald-500/20">
                        <i data-lucide="arrow-right-left" class="w-4 h-4"></i> Movimiento
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
        <!-- Tabs Nav -->
        <div class="flex border-b border-slate-200 mb-6 overflow-x-auto space-x-2">
            <button id="tab-dashboard" onclick="switchTab('dashboard')" class="px-5 py-3 text-xs font-bold text-blue-600 border-b-2 border-blue-600 focus:outline-none flex items-center gap-2">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard KPIs
            </button>
            <button id="tab-orders" onclick="switchTab('orders')" class="px-5 py-3 text-xs font-semibold text-slate-500 hover:text-slate-800 focus:outline-none flex items-center gap-2">
                <i data-lucide="globe-2" class="w-4 h-4"></i> Pedidos Internacionales
            </button>
        </div>

        <!-- Dashboard Section -->
        <div id="content-dashboard" class="fade-in space-y-6">
            <div id="dashboard-loading" class="text-center py-10 hidden"><div class="loader"></div></div>
            
            <div id="dashboard-content" class="space-y-6">
                <!-- Tarjetas KPIs -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 p-5 text-white shadow-lg">
                        <p class="text-xs font-medium text-blue-100 uppercase">Total Productos</p>
                        <h3 id="dash-total-productos" class="text-3xl font-extrabold mt-1">0</h3>
                    </div>
                    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 p-5 text-white shadow-lg">
                        <p class="text-xs font-medium text-emerald-100 uppercase">Valor Inventario</p>
                        <h3 id="dash-valor-inventario" class="text-3xl font-extrabold mt-1">$0.00</h3>
                    </div>
                    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-rose-500 to-red-600 p-5 text-white shadow-lg">
                        <p class="text-xs font-medium text-rose-100 uppercase">Stock Crítico (≤ 5)</p>
                        <h3 id="dash-stock-bajo" class="text-3xl font-extrabold mt-1">0</h3>
                    </div>
                    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-800 p-5 text-white shadow-lg">
                        <p class="text-xs font-medium text-purple-100 uppercase">Flujo (Ent / Sal)</p>
                        <h3 id="dash-total-movimientos" class="text-2xl font-extrabold mt-1">0 / 0</h3>
                    </div>
                </div>

                <!-- Gráficos -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                        <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <i data-lucide="pie-chart" class="w-4 h-4 text-blue-600"></i> Estado del Stock
                        </h3>
                        <div class="relative flex-1 flex items-center justify-center min-h-[220px]">
                            <canvas id="chartStockStatus"></canvas>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm lg:col-span-2 flex flex-col justify-between">
                        <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <i data-lucide="bar-chart-3" class="w-4 h-4 text-indigo-600"></i> Top 5 Productos Más Vendidos
                        </h3>
                        <div class="relative flex-1 min-h-[220px]">
                            <canvas id="chartTopProducts"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pedidos Internacionales -->
        <div id="content-orders" class="hidden fade-in space-y-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200 text-left">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-4 py-3.5 text-xs font-bold text-slate-500 uppercase">N° Pedido</th>
                                <th class="px-4 py-3.5 text-xs font-bold text-slate-500 uppercase">Proveedor</th>
                                <th class="px-4 py-3.5 text-xs font-bold text-slate-500 uppercase">Detalle</th>
                                <th class="px-4 py-3.5 text-xs font-bold text-slate-500 uppercase">Totales</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="bg-white divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 px-5 py-3 rounded-xl text-white font-semibold text-xs shadow-xl transform transition-all duration-300 translate-y-20 opacity-0 z-[60]"></div>

    <script>
        // PEGA AQUÍ LA NUEVA URL OBTENIDA EN EL PASO 2
        var API_URL = "https://script.google.com/macros/s/AKfycbzY2y19tHtoYYsY8e1su8E4iZedh5MHNO8DgCpOsb3PnMi05na7tTOEMVKQdjy8O7sygA/exec";

        var stockChartInstance = null;
        var topProductsChartInstance = null;

        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) lucide.createIcons();
            loadDashboard();
        });

        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value || 0);
        }

        async function fetchAPI(action, payload = null) {
            try {
                let response;
                if (payload) {
                    response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: action, payload: payload })
                    });
                } else {
                    response = await fetch(API_URL + '?action=' + action);
                }
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                return data;
            } catch (err) {
                throw new Error(err.message || 'Error en comunicación con la API');
            }
        }

        function loadDashboard() {
            showLoading('dashboard-loading', true);
            fetchAPI('getDashboardMetrics')
                .then(function(metrics) {
                    document.getElementById('dash-total-productos').textContent = metrics.totalProductos || 0;
                    document.getElementById('dash-valor-inventario').textContent = formatCurrency(metrics.valorTotalInventario || 0);
                    document.getElementById('dash-stock-bajo').textContent = metrics.productosStockBajo || 0;
                    document.getElementById('dash-total-movimientos').textContent = (metrics.totalEntradas || 0) + ' / ' + (metrics.totalSalidas || 0);

                    renderDashboardCharts(metrics);
                    showLoading('dashboard-loading', false);
                })
                .catch(function(err) {
                    showToast(err.message, 'error');
                    showLoading('dashboard-loading', false);
                });
        }

        function renderDashboardCharts(metrics) {
            if (typeof Chart === 'undefined') return;

            var elStock = document.getElementById('chartStockStatus');
            if (elStock) {
                var ctxStock = elStock.getContext('2d');
                if (stockChartInstance) stockChartInstance.destroy();

                stockChartInstance = new Chart(ctxStock, {
                    type: 'doughnut',
                    data: {
                        labels: ['Stock Normal', 'Stock Bajo (<=5)'],
                        datasets: [{
                            data: [metrics.productosStockNormal || 0, metrics.productosStockBajo || 0],
                            backgroundColor: ['#10b981', '#f43f5e'],
                            borderWidth: 0
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }

            var elProducts = document.getElementById('chartTopProducts');
            if (elProducts) {
                var ctxProducts = elProducts.getContext('2d');
                if (topProductsChartInstance) topProductsChartInstance.destroy();

                var topProducts = metrics.topProducts || [];
                var labels = topProducts.map(function(p) { return p.CODIGO || 'N/A'; });
                var dataVentas = topProducts.map(function(p) { return p.TOTAL_VENTAS || 0; });

                topProductsChartInstance = new Chart(ctxProducts, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Unidades Vendidas',
                            data: dataVentas,
                            backgroundColor: '#6366f1',
                            borderRadius: 8
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

        function showLoading(id, show) {
            var el = document.getElementById(id);
            if (el) el.classList.toggle('hidden', !show);
        }

        function showToast(message, type) {
            var toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = 'fixed bottom-5 right-5 px-5 py-3 rounded-xl text-white font-semibold text-xs shadow-xl transform transition-all duration-300 z-[60] ' +
                (type === 'error' ? 'bg-rose-600' : 'bg-emerald-600') + ' translate-y-0 opacity-100';
            setTimeout(function() { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        function switchTab(tab) {
            document.getElementById('content-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('content-orders').classList.toggle('hidden', tab !== 'orders');
            if (tab === 'dashboard') loadDashboard();
        }
    </script>
</body>
</html>
